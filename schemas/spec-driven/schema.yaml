name: spec-driven
version: 1
description: Fluxo de trabalho BR-OpenSpec padrão - proposta → specs → design → tarefas
artifacts:
  - id: proposal
    generates: proposal.md
    description: Documento de proposta inicial que descreve a mudança
    template: proposal.md
    instruction: |
      Crie o documento de proposta que estabelece o WHY (por que) esta mudança é necessária.

      Seções:
      - **Why**: 1-2 frases sobre o problema ou oportunidade. Qual problema isso resolve? Por que agora?
      - **What Changes**: Lista de marcadores das mudanças. Seja específico sobre novas capabilities, modificações ou remoções. Marque mudanças incompatíveis com **BREAKING**.
      - **Capabilities**: Identifique quais specs serão criadas ou modificadas:
        - **New Capabilities**: Liste as capabilities sendo introduzidas. Cada uma vira um novo `specs/<capability-path>/spec.md`. Nomeie cada capability por um comportamento durável do sistema (por exemplo, `user-auth`), não pelo trabalho desta change (por exemplo, `add-login-endpoint`). Escolha um limite coeso que possa abrigar requirements relacionados à medida que o sistema evolui; evite capabilities genéricas que tentam cobrir tudo. Use kebab-case nos segmentos de caminho que você introduzir (ex.: `user-auth` ou `identity/user-auth`) e siga a organização de specs já existente no projeto.
        - **Modified Capabilities**: Liste as capabilities existentes cujos REQUIREMENTS estão mudando. Inclua apenas se o comportamento no nível da spec mudar (não apenas detalhes de implementação). Cada uma precisa de um arquivo de spec delta. Use o caminho exato existente em `openspec/specs/`. Deixe vazio se não houver mudança de requirement.
      - **Impact**: Código, APIs, dependências ou sistemas afetados.

      IMPORTANTE: A seção Capabilities é crítica. Ela cria o contrato entre
      as fases de proposta e specs. Pesquise as specs existentes antes de preenchê-la:
      execute `openspec list --specs` para o inventário de capabilities do projeto e, em seguida,
      `openspec show "<spec-id>" --type spec --json --no-scenarios` para as que
      parecerem relacionadas — isso devolve o purpose e os textos de requirement de uma capability
      sem puxar os arquivos de spec inteiros para o contexto. Mantenha `--type spec`:
      uma change e uma spec com o mesmo nome, sem isso, viram um erro de item ambíguo.
      `openspec list` sem `--specs` lista changes em andamento, não
      specs — ele nunca mostra o que o projeto já cobre. Reutilize o caminho exato de uma
      capability existente em vez de introduzir um nome quase duplicado.
      A leitura filtrada é só uma visão geral. Antes de decidir o que já está
      coberto ou o que deve mudar, leia cada spec relevante por completo, incluindo
      os cenários, com `openspec show "<spec-id>" --type spec`.
      Cada capability listada aqui precisará de um arquivo de spec correspondente.

      Toda change deve declarar pelo menos uma capability (nova ou
      modificada) ou optar explicitamente por não ter specs: `openspec validate` rejeita uma
      change com zero deltas, a menos que o `.openspec.yaml` da change defina
      `skip_specs: true`. Use `skip_specs: true` somente quando não houver mudança de
      comportamento no nível de spec (refatoração pura, ferramental, docs) - specs descrevem
      comportamento, então se o comportamento não muda, nenhuma spec deve mudar também.
      Não invente um requirement só para satisfazer a validação.

      Mantenha conciso (1-2 páginas). Foque no "porquê", não no "como" -
      detalhes de implementação pertencem ao design.md.

      Esta é a fundação - specs, design e tarefas se baseiam nela.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Especificações detalhadas da mudança
    template: spec.md
    instruction: |
      Crie arquivos de especificação que definam o WHAT (o que) o sistema deve fazer.

      Uma spec é um contrato de comportamento, não um plano de implementação.

      Bom conteúdo de spec:
      - Comportamento observável do qual usuários ou sistemas downstream dependem
      - Entradas, saídas e condições de erro
      - Restrições externas (segurança, privacidade, confiabilidade, compatibilidade)
      - Cenários que podem ser testados ou validados explicitamente

      Evite nas specs:
      - Nomes internos de classes/funções
      - Escolhas de bibliotecas ou frameworks
      - Detalhes de implementação passo a passo
      - Planos de execução detalhados (pertencem ao design.md ou tasks.md)

      Teste rápido: se a implementação pode mudar sem alterar o comportamento
      visível externamente, provavelmente não pertence à spec.

      Crie um arquivo de spec por capability listada na seção Capabilities da proposta.
      `<capability-path>` é o diretório do spec relativo a `specs/` (por exemplo,
      `user-auth` ou `identity/user-auth`). Preserve o caminho completo:
      - Novas capabilities: use o caminho exato da proposta em `specs/<capability-path>/spec.md`. Todo segmento de caminho introduzido pela proposta deve estar em kebab-case. Siga a organização existente do projeto; não adicione um novo nível de domínio quando o projeto usa um layout plano.
      - Capabilities modificadas: use o caminho exato existente em `openspec/specs/<capability-path>/` ao criar o delta em `specs/<capability-path>/spec.md`. Execute `openspec list --specs` para confirmar esse caminho antes de escrever o delta — um caminho digitado errado ou inventado aponta para uma capability que não existe, em vez da que você queria. Não mova nem renomeie a capability.

      Escreva os arquivos de spec um de cada vez, para que o usuário veja o progresso e uma
      execução interrompida conserve os arquivos que já foram escritos:
      - Antes de escrever qualquer coisa, compare as capabilities que a proposta lista
        com os arquivos `specs/<capability-path>/spec.md` que já existem,
        e comece pela primeira capability que não tem arquivo. Não reescreva
        um arquivo existente a menos que o usuário peça.
      - Antes de cada arquivo, diga em uma linha qual capability você está escrevendo.
      - Escreva cada arquivo assim que tiver o rascunho. Não planeje todos os arquivos
        antes de escrever o primeiro.
      - Pare quando cada capability que a proposta lista tiver o seu arquivo.

      Deve haver pelo menos um arquivo de spec, a menos que o `.openspec.yaml` da change
      defina `skip_specs: true` (sem mudança de comportamento no nível de spec) - `openspec validate`
      rejeita uma change com zero deltas sem esse marcador. Se a proposta não lista
      capabilities e `skip_specs` não está definido, revise a proposta primeiro.

      Operações de delta (use cabeçalhos ##):
      - **ADDED Requirements**: Novas capabilities
      - **MODIFIED Requirements**: Comportamento alterado - MUST incluir o conteúdo atualizado completo
      - **REMOVED Requirements**: Recursos descontinuados - MUST incluir **Reason** e **Migration**
      - **RENAMED Requirements**: Apenas mudanças de nome - use o formato FROM:/TO:

      Requisitos de formato:
      - Cada requirement: `### Requirement: <name>` seguido de descrição
      - Use SHALL/MUST para requisitos normativos (evite should/may)
      - Cada cenário: `#### Scenario: <name>` no formato WHEN/THEN
      - **CRITICAL**: Os cenários MUST usar exatamente 4 cerquilhas (`####`). Usar 3 cerquilhas ou marcadores falha silenciosamente.
      - Todo requirement MUST ter pelo menos um cenário.
      - Mantenha a descrição de cada requirement (o texto entre `### Requirement:` e o primeiro cenário) em 500 caracteres ou menos. `openspec validate` sinaliza descrições mais longas em requirements ADDED e na spec principal. Isso é um aviso: a validação normal ainda passa, mas `openspec validate --strict` falha nele. Ao escrever um requirement novo, declare um comportamento por requirement: mova exemplos e casos de borda para os cenários, e divida um requirement que cobre vários comportamentos em blocos `### Requirement:` separados, cada um com os próprios cenários. Em MODIFIED, mantenha o bloco do requirement existente inteiro; nunca divida, corte ou reescreva texto existente só para caber no limite. Divida um requirement longo existente somente quando o usuário pedir, numa change feita para isso: em MODIFIED, mantenha o cabeçalho e todos os cenários e reduza a descrição a um comportamento sem mudar o sentido, depois acrescente cada comportamento que você removeu como um requirement ADDED próprio, com os próprios cenários.

      Somente capabilities novas: a primeira seção da spec delta é `## Purpose` -
      uma ou duas frases (50+ caracteres, ou `openspec validate --strict`
      a reporta como muito breve) descrevendo para que serve a capability. O archive
      a copia para o spec principal que ele cria; sem ela, o novo spec principal
      fica com um placeholder `A definir - criado ao arquivar alteração ... Atualize o Purpose após o arquivamento.` para
      preencher à mão. NÃO adicione `## Purpose` a um delta de uma capability existente -
      esse spec já tem um e o do delta é ignorado. Para alterar o Purpose de uma
      capability existente - incluindo um placeholder `A definir` ou `TBD` que sobrou -
      edite `openspec/specs/<capability-path>/spec.md` diretamente.

      Fluxo de trabalho de requirements MODIFIED:
      1. Localize o requirement existente em openspec/specs/<capability-path>/spec.md
      2. Copie o bloco INTEIRO do requirement (de `### Requirement:` até todos os cenários)
      3. Cole sob `## MODIFIED Requirements` e edite para refletir o novo comportamento
      4. Garanta que o texto do cabeçalho corresponda exatamente (ignorando espaços em branco)

      Armadilha comum: Usar MODIFIED com conteúdo parcial perde detalhe no momento do arquivamento.
      Se estiver adicionando novas preocupações sem alterar o comportamento existente, use ADDED.

      Example (capability nova, então abre com `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      As specs devem ser testáveis - cada cenário é um possível caso de teste.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Documento de design técnico com detalhes de implementação
    template: design.md
    instruction: |
      Crie o documento de design que explica o HOW (como) implementar a mudança.

      Quando incluir design.md (crie apenas se algum se aplicar):
      - Mudança transversal (múltiplos serviços/módulos) ou novo padrão arquitetural
      - Nova dependência externa ou mudanças significativas no modelo de dados
      - Complexidade de segurança, desempenho ou migração
      - Ambiguidade que se beneficia de decisões técnicas antes de codificar

      Seções:
      - **Context**: Apenas o estado atual e as restrições necessários para explicar a abordagem. Referencie a proposta para a motivação em vez de repeti-la (por exemplo, "Veja proposal.md - Why").
      - **Goals / Non-Goals**: O que este design alcança e o que explicitamente exclui. Não repita o escopo da proposta - adicione apenas limites no nível do design.
      - **Decisions**: Principais escolhas técnicas com justificativa (por que X em vez de Y?). Inclua as alternativas consideradas para cada decisão.
      - **Risks / Trade-offs**: Limitações conhecidas, coisas que podem dar errado. Formato: [Risco] → Mitigação
      - **Migration Plan**: Passos para implantar, estratégia de rollback (se aplicável)
      - **Open Questions**: Incógnitas que podem ser respondidas depois com segurança, sem mudar as specs, a abordagem ou a divisão de tarefas. Omita se não houver.

      A seção Open Questions é para incógnitas genuinamente adiáveis, não para
      decisões que você pulou. Se uma pergunta mudaria as specs, a abordagem
      escolhida ou a divisão de tarefas, resolva-a agora - pergunte ao usuário
      em vez de presumir.

      Foque na arquitetura e na abordagem, não na implementação linha a linha.
      A proposta cobre o porquê e o quê; o design cobre o como. Referencie a
      proposta para a motivação e, uma vez escritas, as specs para os
      requirements - se uma seção apenas as repetir, aponte para elas.

      Bons documentos de design explicam o "porquê" por trás das decisões técnicas.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Checklist de implementação com tarefas rastreáveis
    template: tasks.md
    instruction: |
      Crie a lista de tarefas que detalha o trabalho de implementação.

      Antes de escrever as tarefas, verifique a seção Open Questions do design.md.
      Se alguma delas mudaria o que será construído, resolva-a com o usuário
      primeiro - não embuta uma suposição não declarada na lista de tarefas.

      **IMPORTANTE: Siga o template abaixo para as tarefas rastreadas.** A fase de apply faz o parse
      do formato de checkbox para acompanhar o progresso. Uma caixa que contém apenas `x` conta como concluída,
      em maiúscula ou minúscula e com qualquer espaçamento, então `- [ x]` também está concluída. Qualquer
      outro marcador, incluindo `- [~]`, `- [-]` e um `- []` vazio, lê-se como
      não concluído. Uma linha sem checkbox não é rastreada.

      Diretrizes:
      - Agrupe tarefas rastreadas relacionadas sob cabeçalhos numerados ##
      - Cada tarefa rastreada MUST ser um checkbox: `- [ ] X.Y Descrição da tarefa`
      - As tarefas devem ser pequenas o suficiente para serem concluídas em uma sessão
      - Ordene as tarefas por dependência (o que precisa ser feito primeiro?)
      - Rastreie trabalho de implementação e verificação que pode ser concluído antes do
        archive. Se o workflow pedido incluir archive ou trabalho que exige
        que esta change já esteja arquivada, preserve esses passos como bullets simples em uma
        seção opcional `## Workflow follow-up` no final de tasks.md. Esses
        bullets são informação de referência, fora do progresso das tarefas rastreadas.
      - Cada tarefa MUST indicar como verificar sua conclusão (um teste, comando,
        comportamento observável ou artifact entregue). Coloque a verificação na
        descrição do checkbox da própria tarefa. Use uma tarefa de verificação
        separada apenas quando ela checar integração mais ampla ou comportamento
        do sistema que atravessa múltiplas tarefas de implementação.
      - Cada grupo de tarefas MUST entregar os testes e a documentação que o próprio
        trabalho pede. NÃO junte teste ou documentação num grupo final —
        quando um grupo tardio exercita pela primeira vez o trabalho de um grupo anterior, as falhas
        voltam em cascata por todos os grupos do meio e forçam retrabalho. Um grupo
        cujo trabalho não pede nenhum dos dois, como scaffolding ou instalação de dependências,
        não carrega nenhum dos dois. Um grupo final serve só para checagens de integração, não para
        os testes e a documentação que um grupo anterior devia.

      Example:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      - [ ] 2.3 Document the export API in docs/export.md and verify the documented command runs as written
      ```

      Quando couber, acrescente o acompanhamento do workflow como bullets simples, por exemplo:
      ```
      ## Workflow follow-up

      - Archive the change after the project's review requirements are satisfied.
      - Verify the archived result.
      ```

      Referencie as specs para o que precisa ser construído e o design para como construir.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Leia os arquivos de contexto, execute as tarefas pendentes e marque como concluídas conforme avança.
    Pause se encontrar bloqueios ou precisar de esclarecimentos.
