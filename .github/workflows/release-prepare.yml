name: Release (prepare)

on:
  push:
    branches: [main]

# Floor for the workflow. The prepare job widens this to pull-requests: write
# for the Version Packages PR.
permissions:
  contents: write
  id-token: write # Required for npm provenance (NPM_CONFIG_PROVENANCE)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'dynamicworks-com-br/BR-OpenSpec'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # changesets opens/updates the Version Packages PR
      id-token: write # Required for npm provenance (NPM_CONFIG_PROVENANCE)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Opens/updates the Version Packages PR; publishes when the Version PR merges
      - name: Create/Update Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore(release): version packages'
          createGithubReleases: true
          # Use CI-specific release script: relies on version PR having been merged
          # so package.json already contains the bumped version.
          publish: pnpm run release:ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
